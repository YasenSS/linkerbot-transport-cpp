<?xml version="1.0"?>
<def format="2">
  <!-- Cppcheck 2.13 cannot parse Catch2 3.8's token-pasted string literals.
       Model its public test macros instead of parsing that implementation.
       Test bodies and assertion operands remain visible to every checker.
       REQUIRE/FAIL/SKIP end a failing test; CHECK records failure and continues.
       This file is used only by Cppcheck, never by a C++ build. -->
  <define name="CATCH_TEST_MACROS_HPP_INCLUDED" value=""/>
  <define name="CPPCHECK_CATCH2_JOIN_IMPL(left,right)" value="left##right"/>
  <define name="CPPCHECK_CATCH2_JOIN(left,right)" value="CPPCHECK_CATCH2_JOIN_IMPL(left,right)"/>
  <define name="TEST_CASE(...)" value="void CPPCHECK_CATCH2_JOIN(cppcheck_catch2_test_,__LINE__)()"/>
  <define name="SECTION(...)" value="if (cppcheck_catch2_section(__VA_ARGS__,__LINE__))"/>
  <define name="REQUIRE(...)" value="do { bool cppcheck_passed = false; try { cppcheck_passed = static_cast&lt;bool&gt;(__VA_ARGS__); } catch (...) { throw Catch::TestFailureException{}; } if (!cppcheck_passed) throw Catch::TestFailureException{}; } while (false)"/>
  <define name="REQUIRE_FALSE(...)" value="do { bool cppcheck_passed = false; try { cppcheck_passed = static_cast&lt;bool&gt;(__VA_ARGS__); } catch (...) { throw Catch::TestFailureException{}; } if (cppcheck_passed) throw Catch::TestFailureException{}; } while (false)"/>
  <define name="CHECK(...)" value="do { try { (void)static_cast&lt;bool&gt;(__VA_ARGS__); } catch (...) {} } while (false)"/>
  <define name="CHECK_FALSE(...)" value="do { try { (void)static_cast&lt;bool&gt;(__VA_ARGS__); } catch (...) {} } while (false)"/>
  <define name="REQUIRE_THROWS_AS(expr,exceptionType)" value="do { bool cppcheck_caught = false; try { (void)(expr); } catch (exceptionType const&amp;) { cppcheck_caught = true; } catch (...) { throw Catch::TestFailureException{}; } if (!cppcheck_caught) throw Catch::TestFailureException{}; } while (false)"/>
  <define name="CHECK_THROWS_AS(expr,exceptionType)" value="do { try { (void)(expr); } catch (...) {} } while (false)"/>
  <define name="REQUIRE_THROWS(...)" value="do { bool cppcheck_caught = false; try { (void)(__VA_ARGS__); } catch (...) { cppcheck_caught = true; } if (!cppcheck_caught) throw Catch::TestFailureException{}; } while (false)"/>
  <define name="REQUIRE_NOTHROW(...)" value="do { try { (void)(__VA_ARGS__); } catch (...) { throw Catch::TestFailureException{}; } } while (false)"/>
  <define name="INFO(...)" value="do { std::ostringstream cppcheck_catch2_info; cppcheck_catch2_info &lt;&lt; __VA_ARGS__; } while (false)"/>
  <define name="FAIL(...)" value="do { std::ostringstream cppcheck_catch2_info; cppcheck_catch2_info &lt;&lt; __VA_ARGS__; throw Catch::TestFailureException{}; } while (false)"/>
  <define name="SKIP(...)" value="do { std::ostringstream cppcheck_catch2_info; cppcheck_catch2_info &lt;&lt; __VA_ARGS__; throw Catch::TestSkipException{}; } while (false)"/>
</def>
