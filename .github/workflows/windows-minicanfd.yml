name: Windows transport regression, native ABI and ZIP

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      use_tool_cache:
        description: Reuse verified fixed CMake tools (disable for same-SHA cold A/B runs)
        type: boolean
        default: true
  workflow_call:
    inputs:
      use_tool_cache:
        description: Reuse verified fixed CMake tools
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-loader:
    name: Native ${{ matrix.arch }} (${{ matrix.configuration }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        arch: [x64, ARM64]
        include:
          - arch: x64
            runner: windows-2022
            generator: Visual Studio 17 2022
            cmake: 3.31.8
            cmake_arch: x86_64
            os_arch: X64
          - arch: ARM64
            runner: windows-11-vs2026-arm
            generator: Visual Studio 18 2026
            cmake: 4.2.3
            cmake_arch: arm64
            os_arch: Arm64
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test CMake cache integrity checks
        run: |
          python validation/tool-cache/test-verify-cmake-tree.py
          if ($LASTEXITCODE -ne 0) { throw 'CMake cache integrity regression failed' }
      - name: Resolve independently published CMake checksum
        id: cmake-tool
        env:
          REQUESTED_CACHE: ${{ inputs.use_tool_cache }}
        run: |
          $Version = '${{ matrix.cmake }}'
          $Architecture = '${{ matrix.cmake_arch }}'
          $Name = "cmake-$Version-windows-$Architecture.zip"
          $Base = "https://github.com/Kitware/CMake/releases/download/v$Version"
          # Never trust checksum metadata restored from the cache itself.
          $Checksums = Join-Path $env:RUNNER_TEMP "cmake-$Version-checksums.txt"
          Invoke-WebRequest "$Base/cmake-$Version-SHA-256.txt" -OutFile $Checksums
          $Line = Get-Content $Checksums | Where-Object { $_ -match " $([regex]::Escape($Name))$" }
          if (@($Line).Count -ne 1) { throw 'CMake checksum entry missing or ambiguous' }
          $Expected = (($Line -split '\s+')[0]).ToLowerInvariant()
          if ($Expected -notmatch '^[0-9a-f]{64}$') { throw 'Invalid official CMake SHA256' }
          $Enabled = if ($env:REQUESTED_CACHE -eq 'false') { 'false' } else { 'true' }
          "enabled=$Enabled" >> $env:GITHUB_OUTPUT
          "sha256=$Expected" >> $env:GITHUB_OUTPUT
          "key=cmake-windows-v1-$Version-$Architecture-$Expected" >> $env:GITHUB_OUTPUT
          "directory=$(Join-Path $env:RUNNER_TEMP "cmake-tools-$Version-$Architecture")" >> $env:GITHUB_OUTPUT
      - name: Restore exact fixed CMake installation
        if: steps.cmake-tool.outputs.enabled == 'true'
        id: cmake-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.cmake-tool.outputs.directory }}
          key: ${{ steps.cmake-tool.outputs.key }}
      - name: Verify cached installation or install authenticated CMake
        env:
          TOOL_DIRECTORY: ${{ steps.cmake-tool.outputs.directory }}
          EXPECTED_SHA256: ${{ steps.cmake-tool.outputs.sha256 }}
          CACHE_ENABLED: ${{ steps.cmake-tool.outputs.enabled }}
          CACHE_HIT: ${{ steps.cmake-cache.outputs.cache-hit }}
        run: |
          $Timer = [System.Diagnostics.Stopwatch]::StartNew()
          $Version = '${{ matrix.cmake }}'
          $Name = "cmake-$Version-windows-${{ matrix.cmake_arch }}.zip"
          $Archive = Join-Path $env:TOOL_DIRECTORY $Name
          $Directory = Join-Path $env:TOOL_DIRECTORY "cmake-$Version-windows-${{ matrix.cmake_arch }}"
          $Evidence = Join-Path $env:RUNNER_TEMP 'cmake-tool-validation.json'
          $VerifiedCache = $false
          if ($env:CACHE_ENABLED -eq 'true' -and (Test-Path $Archive) -and (Test-Path $Directory)) {
            # Check the original ZIP against the fresh official digest, then hash
            # every installed file against that ZIP; a version string is insufficient.
            python validation/tool-cache/verify-cmake-tree.py --archive $Archive --directory $Directory --sha256 $env:EXPECTED_SHA256 > $Evidence
            $VerifiedCache = $LASTEXITCODE -eq 0
            if (!$VerifiedCache) { Write-Warning 'Rejected modified CMake cache; downloading an authenticated replacement' }
          }
          if (!$VerifiedCache) {
            if (Test-Path $env:TOOL_DIRECTORY) { Remove-Item $env:TOOL_DIRECTORY -Recurse -Force }
            New-Item $env:TOOL_DIRECTORY -ItemType Directory -Force | Out-Null
            $Base = "https://github.com/Kitware/CMake/releases/download/v$Version"
            Invoke-WebRequest "$Base/$Name" -OutFile $Archive
            if ((Get-FileHash $Archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_SHA256) { throw 'CMake archive SHA256 mismatch' }
            Expand-Archive $Archive -DestinationPath $env:TOOL_DIRECTORY
            python validation/tool-cache/verify-cmake-tree.py --archive $Archive --directory $Directory --sha256 $env:EXPECTED_SHA256 > $Evidence
            if ($LASTEXITCODE -ne 0) { throw 'Installed CMake failed full content verification' }
          }
          $Validated = Get-Content $Evidence -Raw | ConvertFrom-Json
          $Timer.Stop()
          [ordered]@{
            version = $Version
            architecture = '${{ matrix.cmake_arch }}'
            archive_sha256 = $Validated.sha256
            verified_files = $Validated.verified_files
            cache_enabled = $env:CACHE_ENABLED -eq 'true'
            exact_cache_hit = $env:CACHE_HIT -eq 'true'
            reused_verified_installation = $VerifiedCache
            verify_or_install_seconds = $Timer.Elapsed.TotalSeconds
          } | ConvertTo-Json | Set-Content $Evidence
          "$Directory/bin" >> $env:GITHUB_PATH
          "CMake cache enabled: $env:CACHE_ENABLED; exact action hit: $env:CACHE_HIT; reused verified installation: $VerifiedCache; archive SHA256: $env:EXPECTED_SHA256" >> $env:GITHUB_STEP_SUMMARY
      - name: Save authenticated CMake installation from trusted branch runs
        # PRs may read branch-scoped/default-branch caches but never publish one.
        # Manual dispatch requires repository write access; exact-key restore only.
        if: steps.cmake-tool.outputs.enabled == 'true' && steps.cmake-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.cmake-tool.outputs.directory }}
          key: ${{ steps.cmake-tool.outputs.key }}
      - name: Record source and tools
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne '${{ matrix.os_arch }}') { throw 'Native runner OS architecture mismatch' }
          git rev-parse HEAD
          $ExpectedExecutable = Join-Path '${{ steps.cmake-tool.outputs.directory }}' 'cmake-${{ matrix.cmake }}-windows-${{ matrix.cmake_arch }}/bin/cmake.exe'
          if ([IO.Path]::GetFullPath((Get-Command cmake).Source) -ne [IO.Path]::GetFullPath($ExpectedExecutable)) { throw 'PATH did not select the authenticated CMake installation' }
          $CMakeVersion = @(cmake --version)
          if ($LASTEXITCODE -ne 0 -or $CMakeVersion[0] -ne 'cmake version ${{ matrix.cmake }}') { throw 'Fixed CMake version mismatch' }
          $CMakeVersion
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -format json
      - name: Configure without a vendor SDK
        run: |
          cmake -S . -B build -G '${{ matrix.generator }}' -A '${{ matrix.arch }}' -T 'v143,version=14.44' `
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>DLL' `
            -DLINKERBOT_TRANSPORT_BUILD_TESTS=ON -DLINKERBOT_TRANSPORT_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
      - name: Build tests and native DLL fixtures
        run: |
          cmake --build build --config ${{ matrix.configuration }} --parallel 4 2>&1 | Tee-Object build-results.log
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Verify native executable and DLL machine types
        run: |
          python validation/package/verify-windows-binaries.py build --arch '${{ matrix.arch }}' | Tee-Object build-machine-results.log
          if ($LASTEXITCODE -ne 0) { throw 'Native test binary machine validation failed' }
      - name: Run transport regression and actual Windows loader tests
        run: |
          ctest --test-dir build -C ${{ matrix.configuration }} --show-only=json-v1 > test-list.json
          if ($LASTEXITCODE -ne 0) { throw 'CTest discovery failed' }
          $Tests = (Get-Content test-list.json -Raw | ConvertFrom-Json).tests
          if ($Tests.Count -eq 0 -or 'vendor-native-loader' -notin $Tests.name -or 'pcan-native-loader' -notin $Tests.name) { throw 'Native loader tests were not registered' }
          if (@($Tests | Where-Object { $_.name -like 'SLCAN*' }).Count -lt 10) { throw 'SLCAN offline coverage missing' }
          ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure --no-tests=error --timeout 60 --output-log test-results.log
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Package and consume a relocated standalone ZIP
        run: |
          $Configuration = '${{ matrix.configuration }}'
          cpack --config build/CPackConfig.cmake -C $Configuration -B dist
          if ($LASTEXITCODE -ne 0) { throw 'CPack failed' }
          $Archives = @(Get-ChildItem dist/*.zip)
          if ($Archives.Count -ne 1) { throw 'Expected one ZIP' }
          $Archive = $Archives[0]
          $Expected = (Get-Content "$($Archive.FullName).sha256" -Raw) -split '\s+' | Select-Object -First 1
          if ((Get-FileHash $Archive.FullName -Algorithm SHA256).Hash -ne $Expected) { throw 'ZIP SHA256 mismatch' }
          $Destination = Join-Path $env:RUNNER_TEMP "通信 SDK with spaces $Configuration"
          Expand-Archive $Archive.FullName -DestinationPath $Destination
          $Roots = @(Get-ChildItem $Destination -Directory)
          if ($Roots.Count -ne 1) { throw 'Expected a single package root' }
          $Prefix = $Roots[0].FullName
          foreach ($Required in @('include/linkerbot/can/slcan_transport.hpp', 'share/linkerbot-transport/docs/zh/slcan.md', 'share/linkerbot-transport/docs/zh/session.md', 'share/linkerbot-transport/examples/shared_bus.cpp')) {
            if (!(Test-Path "$Prefix/$Required")) { throw "Missing package entry $Required" }
          }
          foreach ($Required in @('share/linkerbot-transport/LICENSE', 'share/linkerbot-transport/NOTICE', 'share/linkerbot-transport/README.md', 'share/linkerbot-transport/docs/zh/windows-build.md', 'share/linkerbot-transport/build-info.json', 'lib/linkerbot-can.lib', 'lib/cmake/linkerbot-transport/linkerbot-transport-config.cmake', 'include/linkerbot/can/pcan_transport.hpp')) {
            if (!(Test-Path "$Prefix/$Required")) { throw "Missing $Required" }
          }
          $Files = @(Get-ChildItem $Prefix -File -Recurse)
          if ($Files | Where-Object { $_.Name -match 'fixture|PCANBasic\.dll|HCanbus\.dll|catch2' }) { throw 'Test/vendor component leaked into release ZIP' }
          $Files.FullName | Out-File package-files.txt
          $Metadata = Get-Content "$Prefix/share/linkerbot-transport/build-info.json" -Raw | ConvertFrom-Json
          $Runtime = if ($Configuration -eq 'Debug') { 'MDd' } else { 'MD' }
          if ($Metadata.transport_sha -ne (git rev-parse HEAD) -or $Metadata.source_dirty -or $Metadata.configuration -ne $Configuration -or $Metadata.runtime -ne $Runtime -or $Metadata.architecture -ne '${{ matrix.arch }}' -or $Metadata.toolset -ne '143') { throw 'Package provenance/runtime mismatch' }
          python validation/package/verify-package.py "$Prefix" --sha "$(git rev-parse HEAD)" --arch '${{ matrix.arch }}' --system Windows --configuration $Configuration --require-clean
          if ($LASTEXITCODE -ne 0) { throw 'SDK COFF object validation failed' }
          python validation/package/test-naming.py --prefix "$Prefix" --configuration $Configuration --generator '${{ matrix.generator }}' --platform '${{ matrix.arch }}' --toolset 'v143,version=14.44'
          if ($LASTEXITCODE -ne 0) { throw 'Canonical/legacy naming contract failed' }
          cmake -S "$Prefix/share/linkerbot-transport/validation/installed-consumer" -B consumer -G '${{ matrix.generator }}' -A '${{ matrix.arch }}' -T 'v143,version=14.44' "-DCMAKE_PREFIX_PATH=$Prefix"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer configure failed' }
          cmake --build consumer --config $Configuration --parallel 4 2>&1 | Tee-Object consumer-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Consumer build failed' }
          ctest --test-dir consumer -C $Configuration --output-on-failure --no-tests=error --output-log consumer-results.log
          if ($LASTEXITCODE -ne 0) { throw 'Consumer test failed' }
          python validation/package/verify-windows-binaries.py consumer --arch '${{ matrix.arch }}' | Tee-Object consumer-machine-results.log
          if ($LASTEXITCODE -ne 0) { throw 'Native consumer machine validation failed' }
      - name: Upload verified Windows SDK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-windows-${{ matrix.arch }}-${{ matrix.configuration }}-attempt-${{ github.run_attempt }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Save native-loader evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-adapters-${{ matrix.arch }}-${{ matrix.configuration }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cmake-tool-validation.json
            build-results.log
            build-machine-results.log
            consumer-machine-results.log
            test-list.json
            test-results.log
            consumer-build.log
            consumer-results.log
            package-files.txt
            dist/*.zip
            dist/*.sha256
            build/CMakeCache.txt
            build/Testing/Temporary/LastTest.log
