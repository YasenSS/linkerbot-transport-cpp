name: Linux transport regression and installed consumer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M

jobs:
  benchmark-smoke:
    name: Performance harness (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore compiler cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/transport-ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-benchmark-clang18-libcxx-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-benchmark-clang18-libcxx-
      - name: Install benchmark tools
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/transport-ccache" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache cmake ninja-build clang-18 libc++-18-dev libc++abi-18-dev
      - name: Build and exercise both measurement modes
        run: |
          for mode in OFF ON; do
            cmake -S benchmarks -B "build/perf-$mode" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-18 \
              '-DCMAKE_CXX_FLAGS=-stdlib=libc++ -Wall -Wextra -Wpedantic -Werror' \
              -DLINKERBOT_PERF_COUNT_ALLOCATIONS="$mode"
            cmake --build "build/perf-$mode" --parallel 4
            "./build/perf-$mode/linkerbot-perf" \
              --iterations 1000 --idle-ms 25 --repetitions 1 > "benchmark-$mode.csv"
          done
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save smoke-test output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-smoke-arm64
          path: benchmark-*.csv

  offline-tests:
    name: GCC 13 (${{ matrix.runner }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore compiler cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/transport-ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-gcc13-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-gcc13-${{ matrix.build_type }}-
      - name: Install build tools
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/transport-ccache" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ccache cmake ninja-build git ca-certificates gcovr
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLINKERBOT_TRANSPORT_ENABLE_COVERAGE=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} \
            -DLINKERBOT_TRANSPORT_BUILD_TESTS=ON \
            -DLINKERBOT_TRANSPORT_BUILD_EXAMPLES=ON
      - name: Build library, tests and native ABI fixtures
        run: cmake --build build --parallel 4
      - name: Run offline regression
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 60 --output-log test-results.log
      - name: Require 99 percent production line coverage
        if: matrix.build_type == 'Debug'
        run: |
          gcovr --root . --filter '(src|include)/' --gcov-exclude-directories 'build/_deps' \
            --fail-under-line 99 --txt --json coverage.json --json-summary coverage-summary.json build
          python3 - <<'PYTHON'
          import json
          with open('coverage-summary.json', encoding='utf-8') as stream:
              coverage = json.load(stream)
          covered, total = coverage['line_covered'], coverage['line_total']
          print(f'Exact production line coverage: {covered}/{total} ({100 * covered / total:.6f}%)')
          assert covered * 100 > total * 99, 'Production line coverage must exceed 99% before rounding'
          PYTHON
      - name: Verify CAN-only installation with serial and RTU disabled
        if: matrix.build_type == 'Release'
        run: |
          cmake -S . -B build-can-only -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLINKERBOT_TRANSPORT_ENABLE_SERIAL=OFF -DLINKERBOT_TRANSPORT_ENABLE_MODBUS=OFF \
            -DLINKERBOT_TRANSPORT_BUILD_TESTS=OFF -DLINKERBOT_TRANSPORT_BUILD_EXAMPLES=ON \
            -DLINKERBOT_ALLOW_DEPENDENCY_DOWNLOADS=OFF
          cmake --build build-can-only --parallel 4
          ./build-can-only/can-example
          cmake --install build-can-only --prefix "$RUNNER_TEMP/transport-can-only"
          cmake -S validation/installed-consumer -B consumer-can-only -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/transport-can-only"
          cmake --build consumer-can-only --parallel 4
          ctest --test-dir consumer-can-only --output-on-failure --no-tests=error --timeout 60
      - name: Repeat Session recovery regression
        run: |
          ctest --test-dir build -R '^Session recover' --repeat until-fail:20 \
            --output-on-failure --no-tests=error --timeout 60 --output-log recovery-results.log
      - name: Repeat Session registry handoff regressions
        run: |
          ctest --test-dir build \
            -R '^(Session registry waiters recheck a replacement active generation|Session registry ignores waits for a published initialization attempt|Session registry rebinds a waiter to a replacement initialization attempt)$' \
            --repeat until-fail:20 --output-on-failure --no-tests=error --timeout 60 \
            --output-log registry-handoff-results.log
      - name: Run shared-bus example
        run: ./build/can-example
      - name: Install and test a standalone consumer
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/transport install"
          cmake -S "$RUNNER_TEMP/transport install/share/linkerbot-transport/validation/installed-consumer" \
            -B consumer -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS=${{ matrix.build_type == 'Debug' && '--coverage' || '' }} \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/transport install"
          cmake --build consumer --parallel 4
          ctest --test-dir consumer --output-on-failure --no-tests=error --timeout 60 --output-log consumer-results.log
      - name: Verify canonical and legacy package consumers
        run: python3 validation/package/test-naming.py --prefix "$RUNNER_TEMP/transport install" --configuration ${{ matrix.build_type }} ${{ matrix.build_type == 'Debug' && '--coverage' || '' }}
      - name: Build and run the installed quickstart
        run: |
          cmake -S "$RUNNER_TEMP/transport install/share/linkerbot-transport/examples/quickstart" \
            -B quickstart -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS=${{ matrix.build_type == 'Debug' && '--coverage' || '' }} \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/transport install"
          cmake --build quickstart --parallel 4
          ctest --test-dir quickstart --output-on-failure --no-tests=error --timeout 60 \
            --output-log quickstart-results.log
      - name: Package and verify a relocated Release SDK
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          cpack --config build/CPackConfig.cmake -C Release -B dist
          archives=(dist/*.tar.gz)
          test "${#archives[@]}" -eq 1
          (cd dist && sha256sum --check -- *.sha256)
          mkdir package-check
          tar -xzf "${archives[0]}" -C package-check
          roots=(package-check/*)
          test "${#roots[@]}" -eq 1
          prefix="${roots[0]}"
          python3 - "$prefix" "$(git rev-parse HEAD)" <<'PY'
          import json
          from pathlib import Path
          import platform
          import re
          import sys
          root = Path(sys.argv[1])
          info = json.loads((root / 'share/linkerbot-transport/build-info.json').read_text())
          version = re.search(r'set\(CPACK_PACKAGE_VERSION "([^"]+)"\)',
                              Path('build/CPackConfig.cmake').read_text()).group(1)
          assert info['transport_sha'] == sys.argv[2] and info['source_dirty'] is False, info
          assert info['version'] == version and info['configuration'] == 'Release', info
          assert info['system'] == 'Linux' and info['architecture'] == platform.machine(), info
          files = [path for path in root.rglob('*') if path.is_file()]
          assert not any(path.suffix in ('.so', '.dll', '.exe') or 'Catch2' in path.name
                         or path.name in ('can-tests', 'pcan-tests', 'vendor-loader-tests')
                         for path in files), 'Runtime or test binary leaked into the SDK'
          print(json.dumps(info, indent=2))
          PY
          LC_ALL=C readelf -h "$prefix/lib/liblinkerbot-can.a" > package-architecture.txt
          python3 - <<'PY'
          from pathlib import Path
          import platform
          import re
          machines = re.findall(r'Machine:\s+(.+)', Path('package-architecture.txt').read_text())
          expected = {'aarch64': 'AArch64', 'x86_64': 'Advanced Micro Devices X86-64'}[platform.machine()]
          assert machines and all(machine.strip() == expected for machine in machines), machines
          print(f'Verified {len(machines)} library objects: {expected}')
          PY
          cmake -S "$prefix/share/linkerbot-transport/validation/installed-consumer" \
            -B package-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/$prefix"
          cmake --build package-consumer --parallel 4
          ctest --test-dir package-consumer --output-on-failure --no-tests=error --timeout 60 \
            --output-log package-consumer-results.log
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-transport-${{ matrix.runner }}-${{ matrix.build_type }}
          path: |
            test-results.log
            recovery-results.log
            registry-handoff-results.log
            consumer-results.log
            quickstart-results.log
            package-architecture.txt
            package-consumer-results.log
            dist/*.tar.gz
            dist/*.sha256
            coverage-summary.json
            coverage.json
            build/CMakeCache.txt
            build/Testing/Temporary/LastTest.log
            consumer/Testing/Temporary/LastTest.log
            quickstart/Testing/Temporary/LastTest.log

  minimum-cmake:
    name: CMake 3.16.9 (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore compiler cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/transport-ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-minimum-gcc13-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-minimum-gcc13-
      - name: Install build tools
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/transport-ccache" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ccache cmake ninja-build curl ca-certificates
      - name: Restore verified-source CMake installation
        id: minimum-cmake-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/cmake-minimum-install
          key: cmake-3.16.9-1708361827a5a0de37d55f5c9698004c035abb1de6120a376d5d59a81630191f-ubuntu24.04-${{ runner.arch }}-gcc13-noopenssl-v1
      - name: Build the minimum supported CMake from verified source
        if: steps.minimum-cmake-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            https://cmake.org/files/v3.16/cmake-3.16.9.tar.gz \
            --output "$RUNNER_TEMP/cmake-3.16.9.tar.gz"
          printf '%s  %s\n' \
            '1708361827a5a0de37d55f5c9698004c035abb1de6120a376d5d59a81630191f' \
            "$RUNNER_TEMP/cmake-3.16.9.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cmake-3.16.9.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/cmake-3.16.9" -B "$RUNNER_TEMP/cmake-minimum-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_USE_OPENSSL=OFF -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cmake-minimum-install" \
            2>&1 | tee minimum-cmake-configure.log
          cmake --build "$RUNNER_TEMP/cmake-minimum-build" --parallel 4 \
            2>&1 | tee minimum-cmake-build.log
          cmake --install "$RUNNER_TEMP/cmake-minimum-build"
      - name: Verify restored minimum tool version
        run: |
          "$RUNNER_TEMP/cmake-minimum-install/bin/cmake" --version | tee minimum-cmake-version.txt
          grep -Fx 'cmake version 3.16.9' minimum-cmake-version.txt
      - name: Require an actionable error for tests on CMake 3.16.9
        run: |
          if "$RUNNER_TEMP/cmake-minimum-install/bin/cmake" -S . -B build-minimum-tests \
            -G Ninja -DLINKERBOT_TRANSPORT_BUILD_TESTS=ON \
            -DLINKERBOT_ALLOW_DEPENDENCY_DOWNLOADS=OFF > minimum-tests-rejection.log 2>&1; then
            cat minimum-tests-rejection.log
            echo 'Expected CMake 3.16.9 to reject Catch2 test discovery' >&2
            exit 1
          fi
          cat minimum-tests-rejection.log
          grep -F 'Tests require CMake 3.19' minimum-tests-rejection.log
      - name: Configure, build and install with CMake 3.16.9
        run: |
          minimum_cmake="$RUNNER_TEMP/cmake-minimum-install/bin/cmake"
          "$minimum_cmake" -S . -B build-minimum -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLINKERBOT_TRANSPORT_BUILD_TESTS=OFF -DLINKERBOT_ALLOW_DEPENDENCY_DOWNLOADS=OFF \
            -DLINKERBOT_TRANSPORT_BUILD_EXAMPLES=ON 2>&1 | tee minimum-project-configure.log
          "$minimum_cmake" --build build-minimum --parallel 4 2>&1 | tee minimum-project-build.log
          "$minimum_cmake" --install build-minimum --prefix "$RUNNER_TEMP/transport minimum install" \
            2>&1 | tee minimum-project-install.log
          ./build-minimum/can-example
      - name: Build and run the installed quickstart with CMake 3.16.9
        run: |
          minimum_cmake="$RUNNER_TEMP/cmake-minimum-install/bin/cmake"
          "$minimum_cmake" -S "$RUNNER_TEMP/transport minimum install/share/linkerbot-transport/examples/quickstart" \
            -B quickstart-minimum -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/transport minimum install" \
            2>&1 | tee minimum-quickstart-configure.log
          "$minimum_cmake" --build quickstart-minimum --parallel 4 \
            2>&1 | tee minimum-quickstart-build.log
          grep -F 'linkerbot-quickstart' quickstart-minimum/CTestTestfile.cmake
          # --test-dir was added after CMake 3.16; run CTest from the build directory.
          (cd quickstart-minimum && "$RUNNER_TEMP/cmake-minimum-install/bin/ctest" \
            --output-on-failure --timeout 60 \
            --output-log ../minimum-quickstart-results.log)
      - name: Verify canonical and legacy discovery with minimum CMake
        run: |
          python3 validation/package/test-naming.py \
            --prefix "$RUNNER_TEMP/transport minimum install" \
            --cmake "$RUNNER_TEMP/cmake-minimum-install/bin/cmake"
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save minimum-version evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimum-cmake-ubuntu-24.04-arm
          path: |
            minimum-*.log
            minimum-cmake-version.txt
            build-minimum/CMakeCache.txt
            quickstart-minimum/CMakeCache.txt
            quickstart-minimum/Testing/Temporary/LastTest.log

  clang-quality:
    name: Clang 18 (${{ matrix.runner }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        mode: [libcxx, asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore compiler cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/transport-ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-clang18-${{ matrix.mode }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-clang18-${{ matrix.mode }}-
      - name: Install Clang toolchain
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/transport-ccache" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake ninja-build git ca-certificates \
            clang-18 llvm-18 libc++-18-dev libc++abi-18-dev libclang-rt-18-dev
          {
            uname -a
            cmake --version
            clang++-18 --version
          } | tee clang-toolchain.txt
      - name: Check configuration-specific package identities
        if: matrix.runner == 'ubuntu-24.04-arm' && matrix.mode == 'libcxx'
        run: python3 validation/package/test-cmake-package.py --compiler clang++-18
      - name: Configure Clang quality build
        run: |
          compile_flags='-Wall -Wextra -Wpedantic'
          link_flags=''
          case '${{ matrix.mode }}' in
            libcxx)
              compile_flags="$compile_flags -Werror -stdlib=libc++"
              link_flags='-stdlib=libc++'
              ;;
            asan-ubsan)
              compile_flags="$compile_flags -fsanitize=address,undefined -fno-omit-frame-pointer"
              link_flags='-fsanitize=address,undefined'
              ;;
            tsan)
              compile_flags="$compile_flags -fsanitize=thread -fno-omit-frame-pointer"
              link_flags='-fsanitize=thread'
              ;;
            *)
              echo "Unsupported Clang mode: ${{ matrix.mode }}" >&2
              exit 2
              ;;
          esac
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            "-DCMAKE_CXX_FLAGS=$compile_flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=$link_flags" \
            "-DCMAKE_SHARED_LINKER_FLAGS=$link_flags" \
            -DLINKERBOT_TRANSPORT_BUILD_TESTS=ON \
            -DLINKERBOT_TRANSPORT_BUILD_EXAMPLES=ON
      - name: Build library, tests and native ABI fixtures
        run: cmake --build build --parallel 4
      - name: Run Clang regression
        run: |
          case '${{ matrix.mode }}' in
            libcxx)
              ctest --test-dir build --output-on-failure --no-tests=error --timeout 90 \
                --output-log clang-test-results.log
              ;;
            asan-ubsan)
              symbolizer="$(command -v llvm-symbolizer-18 || command -v llvm-symbolizer)"
              export ASAN_SYMBOLIZER_PATH="$symbolizer"
              export ASAN_OPTIONS='detect_leaks=1:halt_on_error=1'
              export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
              ctest --test-dir build -E '^(pcan-native-loader|vendor-native-loader)$' \
                --output-on-failure --no-tests=error --timeout 90 \
                --output-log clang-test-results.log
              ;;
            tsan)
              symbolizer="$(command -v llvm-symbolizer-18 || command -v llvm-symbolizer)"
              export TSAN_OPTIONS="halt_on_error=1:second_deadlock_stack=1:external_symbolizer_path=$symbolizer"
              ctest --test-dir build --output-on-failure --no-tests=error --timeout 120 \
                --output-log clang-test-results.log
              ;;
          esac
      - name: Run shared-bus example with libc++
        if: matrix.mode == 'libcxx'
        run: ./build/can-example
      - name: Install and test a libc++ consumer
        if: matrix.mode == 'libcxx'
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/transport clang install"
          cmake -S "$RUNNER_TEMP/transport clang install/share/linkerbot-transport/validation/installed-consumer" \
            -B consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            '-DCMAKE_CXX_FLAGS=-stdlib=libc++ -Wall -Wextra -Wpedantic -Werror' \
            '-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++' \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/transport clang install"
          cmake --build consumer --parallel 4
          ctest --test-dir consumer --output-on-failure --no-tests=error --timeout 60 \
            --output-log clang-consumer-results.log
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save Clang test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-clang-${{ matrix.runner }}-${{ matrix.mode }}
          path: |
            clang-toolchain.txt
            clang-test-results.log
            clang-consumer-results.log
            build/CMakeCache.txt
            build/Testing/Temporary/LastTest.log
            consumer/Testing/Temporary/LastTest.log
