name: Focal baseline SDK packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Focal GCC 9 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull and record baseline image
        run: |
          mkdir -p build
          docker pull ubuntu:20.04
          docker image inspect ubuntu:20.04 --format '{{index .RepoDigests 0}}' > build/build-image.txt
      - name: Build clean Release SDK using the default Focal compiler
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e SOURCE_SHA="$GITHUB_SHA" -e BUILD_IMAGE="$(cat build/build-image.txt)" \
            "$(cat build/build-image.txt)" bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends build-essential cmake ninja-build git ca-certificates python3 binutils
              git config --global --add safe.directory /src
              python3 validation/package/test-verify-package.py
              python3 ci/test-unpack-sdk.py
              g++ --version
              cmake --version
              cmake -S . -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DLINKERBOT_COMM_BUILD_TESTS=OFF -DLINKERBOT_COMM_BUILD_EXAMPLES=OFF \
                -DLINKERBOT_ALLOW_DEPENDENCY_DOWNLOADS=OFF \
                -DLINKERBOT_COMM_RELEASE_BUILD=ON \
                -DLINKERBOT_COMM_SOURCE_REVISION="$SOURCE_SHA" \
                -DLINKERBOT_COMM_BUILD_IMAGE="$BUILD_IMAGE"
              cmake --build build/package --parallel 4
              # CPack 3.16 can silently create an empty archive with a relative -B.
              cpack --config build/package/CPackConfig.cmake -C Release -B "$PWD/dist"
              prefix=$(bash ci/unpack-sdk.sh /src/dist "/tmp/SDK with spaces")
              python3 validation/package/verify-package.py "$prefix" --sha "$SOURCE_SHA" \
                --arch "$(uname -m)" --configuration Release --require-clean
              bash ci/ubuntu-smoke.sh "$prefix"
            '
      - name: Upload exact package bytes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Save baseline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-evidence-${{ matrix.arch }}
          path: |
            build/build-image.txt
            build/package/CMakeCache.txt
            build/evidence/
            build/smoke-*/Testing/Temporary/LastTest.log
