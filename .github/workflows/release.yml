name: Validate release and optionally create draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Create a draft Release for the selected immutable version tag after all gates pass'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a matching version tag on main history
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), tag
          version = re.search(r'project\(linkerbot-comm VERSION ([0-9.]+)', Path('CMakeLists.txt').read_text()).group(1)
          assert tag == 'v' + version, (tag, version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
  quality-gate:
    needs: validate-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful quality workflows for this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.request
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers)) as response:
                  return json.load(response)
          runs = get('/actions/runs?head_sha=' + os.environ['GITHUB_SHA'] + '&per_page=100')['workflow_runs']
          required = {'.github/workflows/linux.yml': 12, '.github/workflows/windows-minicanfd.yml': 4,
                      '.github/workflows/style.yml': 1, '.github/workflows/cppreportcard.yml': 1}
          for path, minimum_jobs in required.items():
              candidates = [r for r in runs if r['path'] == path and r['event'] in ('push', 'workflow_dispatch')]
              assert candidates, 'Run the quality workflow on this exact commit first: ' + path
              run = max(candidates, key=lambda r: r['id'])
              assert run['status'] == 'completed' and run['conclusion'] == 'success', run['html_url']
              jobs = get('/actions/runs/' + str(run['id']) + '/jobs?per_page=100')['jobs']
              assert len(jobs) >= minimum_jobs and all(j['conclusion'] == 'success' for j in jobs), run['html_url']
              print(path, run['html_url'])
          PYTHON
  packages:
    needs: validate-tag
    uses: ./.github/workflows/package.yml
    with:
      baseline_only: false
  windows-packages:
    needs: validate-tag
    uses: ./.github/workflows/windows-minicanfd.yml
  compatibility:
    needs: packages
    uses: ./.github/workflows/compatibility.yml
    with:
      full_matrix: true
      packages_ready: true
  draft:
    # Tag pushes validate only. Draft creation is an explicit manual opt-in;
    # this workflow never publishes or replaces release assets.
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft
    needs: [validate-tag, quality-gate, packages, windows-packages, compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sdk-*
          path: release-assets
          merge-multiple: true
      - name: Verify all twelve tested native archives and assemble manifest
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        shell: bash
        run: |
          python3 validation/package/test-verify-package.py
          python3 validation/package/test-release-manifest.py
          python3 validation/package/make-release-manifest.py release-assets \
            --sha "$GITHUB_SHA" --version "$VERSION" --targets ci/package-targets.json \
            --validation-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Create a new draft without overwriting any existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers)) as response:
                  return json.load(response)
          target = get('/git/ref/tags/' + os.environ['GITHUB_REF_NAME'])['object']
          for _ in range(8):
              if target['type'] != 'tag':
                  break
              target = get('/git/tags/' + target['sha'])['object']
          assert target['type'] == 'commit' and target['sha'] == os.environ['GITHUB_SHA'], 'Version tag moved since validation'
          request = urllib.request.Request(base + '/releases/tags/' + os.environ['GITHUB_REF_NAME'], headers=headers)
          try:
              urllib.request.urlopen(request)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit('Release already exists; refusing to replace assets')
          PY
          gh release create "$GITHUB_REF_NAME" release-assets/* --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes 'Validated native Ubuntu 20.04/22.04/24.04/26.04 x86_64/ARM64 and Windows x64/ARM64 Debug/Release static SDKs. See release-manifest.json and linked CI run for build identity and compatibility evidence. Hardware acceptance is separate.'
      - name: Download draft assets and verify uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/release-download"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          expected = Path('release-assets')
          actual = Path(os.environ['RUNNER_TEMP']) / 'release-download'
          expected_files = {p.name for p in expected.iterdir() if p.is_file()}
          assert expected_files == {p.name for p in actual.iterdir() if p.is_file()}
          for name in expected_files:
              assert hashlib.sha256((expected / name).read_bytes()).digest() == hashlib.sha256((actual / name).read_bytes()).digest(), name
          print('All uploaded draft assets match the validated local bytes')
          PY
