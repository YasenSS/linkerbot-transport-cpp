name: Validate release and optionally create draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Create a draft Release for the selected immutable version tag after all gates pass'
        type: boolean
        default: false
      validated_run_id:
        description: 'Exact successful sealed tag-push run to promote; required for create_draft'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_object: ${{ steps.version.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a matching version tag on main history
        id: version
        env:
          CREATE_DRAFT: ${{ inputs.create_draft }}
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), tag
          version = re.search(r'project\(linkerbot-transport VERSION ([0-9.]+)', Path('CMakeLists.txt').read_text()).group(1)
          assert tag == 'v' + version, (tag, version)
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              source = os.environ['VALIDATED_RUN_ID']
              if os.environ['CREATE_DRAFT'] == 'true':
                  assert re.fullmatch(r'[1-9][0-9]*', source), 'Draft promotion requires an explicit validated_run_id'
              else:
                  assert not source, 'validated_run_id is only used with create_draft=true'
          tag_object = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + tag], text=True).strip()
          peeled = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          assert peeled == os.environ['GITHUB_SHA'], 'Checked-out tag source SHA mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
              output.write('tag_object=' + tag_object + '\n')
          PY
  quality-gate:
    needs: validate-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful quality workflows for this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.request
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers)) as response:
                  return json.load(response)
          runs = get('/actions/runs?head_sha=' + os.environ['GITHUB_SHA'] + '&per_page=100')['workflow_runs']
          required = {'.github/workflows/linux.yml': 12, '.github/workflows/windows-minicanfd.yml': 4,
                      '.github/workflows/style.yml': 1, '.github/workflows/cppreportcard.yml': 1,
                      '.github/workflows/focal-session.yml': 2}
          for path, minimum_jobs in required.items():
              candidates = [r for r in runs if r['path'] == path and r['event'] in ('push', 'workflow_dispatch')]
              assert candidates, 'Run the quality workflow on this exact commit first: ' + path
              run = max(candidates, key=lambda r: r['id'])
              assert run['status'] == 'completed' and run['conclusion'] == 'success', run['html_url']
              jobs = get('/actions/runs/' + str(run['id']) + '/jobs?per_page=100')['jobs']
              assert len(jobs) >= minimum_jobs and all(j['conclusion'] == 'success' for j in jobs), run['html_url']
              print(path, run['html_url'])
          PYTHON
  packages:
    if: github.event_name == 'push' || !inputs.create_draft
    needs: validate-tag
    uses: ./.github/workflows/package.yml
    with:
      baseline_only: false
  windows-packages:
    if: github.event_name == 'push' || !inputs.create_draft
    needs: validate-tag
    uses: ./.github/workflows/windows-minicanfd.yml
  compatibility:
    if: github.event_name == 'push' || !inputs.create_draft
    needs: packages
    uses: ./.github/workflows/compatibility.yml
    with:
      full_matrix: true
      packages_ready: true
  seal-validation:
    if: github.event_name == 'push'
    needs: [validate-tag, quality-gate, packages, windows-packages, compatibility]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Seal exact tag, attempt, matrix and original SDK artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT: ${{ needs.validate-tag.outputs.tag_object }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python3 validation/package/test-release-provenance.py
          python3 validation/package/release-provenance.py seal \
            --run-id "$GITHUB_RUN_ID" --tag-object "$TAG_OBJECT" --version "$VERSION" \
            --assets build/validated-sdk --output build/release-seal
      - name: Save immutable validation seal for this exact attempt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-attempt-${{ github.run_attempt }}
          path: |
            build/release-seal/validation.json
            build/release-seal/release-manifest.json
          if-no-files-found: error
  draft:
    # Promotion reuses an explicit completed tag-push run; it never rebuilds,
    # selects latest implicitly, publishes, or replaces existing release assets.
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft
    needs: [validate-tag, quality-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Revalidate and reuse only the explicitly sealed tag-push artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
          TAG_OBJECT: ${{ needs.validate-tag.outputs.tag_object }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        shell: bash
        run: |
          python3 validation/package/test-verify-package.py
          python3 validation/package/test-release-manifest.py
          python3 validation/package/test-release-provenance.py
          python3 validation/package/release-provenance.py reuse \
            --run-id "$VALIDATED_RUN_ID" --tag-object "$TAG_OBJECT" --version "$VERSION" \
            --assets release-assets
      - name: Create a new draft without overwriting any existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT: ${{ needs.validate-tag.outputs.tag_object }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers)) as response:
                  return json.load(response)
          target = get('/git/ref/tags/' + os.environ['GITHUB_REF_NAME'])['object']
          assert target['sha'] == os.environ['TAG_OBJECT'], 'Version tag object changed since validation'
          for _ in range(8):
              if target['type'] != 'tag':
                  break
              target = get('/git/tags/' + target['sha'])['object']
          assert target['type'] == 'commit' and target['sha'] == os.environ['GITHUB_SHA'], 'Version tag moved since validation'
          request = urllib.request.Request(base + '/releases/tags/' + os.environ['GITHUB_REF_NAME'], headers=headers)
          try:
              urllib.request.urlopen(request)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit('Release already exists; refusing to replace assets')
          PY
          gh release create "$GITHUB_REF_NAME" release-assets/* --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes 'Validated native Ubuntu 20.04/22.04/24.04/26.04 x86_64/ARM64 and Windows x64/ARM64 Debug/Release static SDKs. See release-manifest.json and linked CI run for build identity and compatibility evidence. Hardware acceptance is separate.'
      - name: Download draft assets and verify uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/release-download"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          expected = Path('release-assets')
          actual = Path(os.environ['RUNNER_TEMP']) / 'release-download'
          expected_files = {p.name for p in expected.iterdir() if p.is_file()}
          assert expected_files == {p.name for p in actual.iterdir() if p.is_file()}
          for name in expected_files:
              assert hashlib.sha256((expected / name).read_bytes()).digest() == hashlib.sha256((actual / name).read_bytes()).digest(), name
          print('All uploaded draft assets match the validated local bytes')
          PY
